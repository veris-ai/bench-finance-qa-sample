schema_version = "1.4"
artifacts = ["/logs/agent/trajectory.json", "/logs/agent/oracle.txt", { source = "/tmp/world/ledger.json", service = "world" }, { source = "/tmp/world/state-dropbox.json", service = "world" }]

[task]
name = "veris/financeqa__irs-vs-post-office-officer-accountability-1962"
description = "At June 30, 1962, by how much did the total dollar accountability of accountable officers attached to the Internal Revenue Service exceed that of accountable officers attached to the Post Office Department? Give the amount in dollars and cents."
keywords = ["Very blurry scan", "Large doc", "Single source", "Misprint", "Arithmetic", "medium"]

[metadata]
difficulty = "medium"
task_id = "task_tq1vixn48p7j9z2jk9r8q"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["world", "pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "archive.ubuntu.com", "security.ubuntu.com", "ports.ubuntu.com", "api.anthropic.com"]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048
storage_mb = 2048

[[verifier.collect]]
service = "world"
command = "python3 /veris/harbor_collect.py /tmp/world dropbox=7200"
timeout_sec = 60.0

[environment]
build_timeout_sec = 1200.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[environment.mcp_servers]]
name = "dropbox"
transport = "streamable-http"
url = "http://world:6200/mcp"
