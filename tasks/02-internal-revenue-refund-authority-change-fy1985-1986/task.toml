schema_version = "1.4"
artifacts = ["/logs/agent/trajectory.json", "/logs/agent/oracle.txt", { source = "/tmp/world/ledger.json", service = "world" }, { source = "/tmp/world/state-dropbox.json", service = "world" }]

[task]
name = "veris/financeqa__internal-revenue-refund-authority-change-fy1985-1986"
description = "By how much did the appropriations and other obligational authority for refunding internal revenue collections change from fiscal year 1985 to fiscal year 1986? Report the fiscal 1986 amount minus the fiscal 1985 amount, in dollars to the cent."
keywords = ["Clear scan", "Medium doc", "Multi-source", "Misprint", "Arithmetic", "easy"]

[metadata]
difficulty = "easy"
task_id = "task_a2tafezo6lu47bppam19f"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["world", "pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "archive.ubuntu.com", "security.ubuntu.com", "ports.ubuntu.com", "api.anthropic.com"]

[verifier]
timeout_sec = 600.0

[[verifier.collect]]
service = "world"
command = "python3 /veris/harbor_collect.py /tmp/world dropbox=7200"
