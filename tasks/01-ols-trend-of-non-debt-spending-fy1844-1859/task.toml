schema_version = "1.4"
artifacts = ["/logs/agent/trajectory.json", "/logs/agent/oracle.txt", { source = "/tmp/world/ledger.json", service = "world" }, { source = "/tmp/world/state-dropbox.json", service = "world" }]

[task]
name = "veris/financeqa__ols-trend-of-non-debt-spending-fy1844-1859"
description = "Fit annual expenditures exclusive of the public debt against the fiscal year by ordinary least squares over the sixteen fiscal years ended June 30, 1844 through June 30, 1859. What is the fitted average annual increase? Give the answer in dollars per year, rounded to the nearest cent."
keywords = ["Clear scan", "Large doc", "Multi-source", "Misprint", "Statistics", "hard"]

[metadata]
difficulty = "hard"
task_id = "task_znyjn0wfwzb2ttga1cjmj"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["world", "pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "archive.ubuntu.com", "security.ubuntu.com", "ports.ubuntu.com", "api.anthropic.com"]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
env = { OPENAI_API_KEY = "${OPENAI_API_KEY:-}", OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://api.openai.com/v1}", JUDGE_MODEL = "${JUDGE_MODEL:-gpt-5.6-terra}" }

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
cpus = 1
memory_mb = 2048
storage_mb = 2048

[[verifier.collect]]
service = "world"
command = "python3 /veris/harbor_collect.py /tmp/world dropbox=7200"
timeout_sec = 60.0

[environment]
build_timeout_sec = 1200.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[environment.mcp_servers]]
name = "dropbox"
transport = "streamable-http"
url = "http://world:6200/mcp"
