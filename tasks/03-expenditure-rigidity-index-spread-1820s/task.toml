schema_version = "1.4"
artifacts = ["/logs/agent/trajectory.json", "/logs/agent/oracle.txt", { source = "/tmp/world/ledger.json", service = "world" }, { source = "/tmp/world/state-dropbox.json", service = "world" }]

[task]
name = "veris/financeqa__expenditure-rigidity-index-spread-1820s"
description = "Define a calendar year's expenditure rigidity index as expenditure on the civil list plus revolutionary and other pensions, taken as a percentage of that year's expenditures exclusive of the public debt. Across calendar years 1824, 1827, 1828 and 1829, by how many percentage points does the highest annual rigidity index exceed the lowest? Report to four decimal places."
keywords = ["Clear scan", "Large doc", "Single source", "Misprint", "Percent", "medium"]

[metadata]
difficulty = "medium"
task_id = "task_vzsgx88h76j6bmgov3cfd"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["world", "pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "archive.ubuntu.com", "security.ubuntu.com", "ports.ubuntu.com", "api.anthropic.com"]

[verifier]
timeout_sec = 600.0

[[verifier.collect]]
service = "world"
command = "python3 /veris/harbor_collect.py /tmp/world dropbox=7200"
timeout_sec = 60.0

[environment]
build_timeout_sec = 1200.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[environment.mcp_servers]]
name = "dropbox"
transport = "streamable-http"
url = "http://world:6200/mcp"
