schema_version = "1.4"
artifacts = ["/logs/agent/trajectory.json", "/logs/agent/oracle.txt", { source = "/tmp/world/ledger.json", service = "world" }, { source = "/tmp/world/state-dropbox.json", service = "world" }]

[task]
name = "veris/financeqa__appropriation-mix-dissimilarity-1820-vs-1829"
description = "Treating appropriations made by law under the seven categories other than the public debt (civil list; foreign intercourse; miscellaneous; military service; revolutionary and other pensions; Indian department; naval establishment), what is the index of dissimilarity between the calendar year 1820 and calendar year 1829 category mixes? Compute it as half the sum, across the seven categories, of the absolute difference between each category's share of its own year's total, and report it as a percentage rounded to two decimal places."
keywords = ["Blurry scan", "Large doc", "Single source", "Misprint", "Statistics", "easy"]

[metadata]
difficulty = "easy"
task_id = "task_6ee4ggz8btmae69k07rnl"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["world", "pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "archive.ubuntu.com", "security.ubuntu.com", "ports.ubuntu.com", "api.anthropic.com"]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
env = { OPENAI_API_KEY = "${OPENAI_API_KEY:-}", OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://api.openai.com/v1}", JUDGE_MODEL = "${JUDGE_MODEL:-gpt-5.6-terra}" }

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
cpus = 1
memory_mb = 2048
storage_mb = 2048

[[verifier.collect]]
service = "world"
command = "python3 /veris/harbor_collect.py /tmp/world dropbox=7200"
timeout_sec = 60.0

[environment]
build_timeout_sec = 1200.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[environment.mcp_servers]]
name = "dropbox"
transport = "streamable-http"
url = "http://world:6200/mcp"
